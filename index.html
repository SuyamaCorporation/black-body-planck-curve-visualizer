<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black-Body Radiation Planck Curve Visualizer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #030712; }
  .glow { text-shadow: 0 0 10px #f59e0b, 0 0 20px #d97706; }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    background: #1f2937;
    height: 6px;
    border-radius: 3px;
    outline: none;
    width: 100%;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #f59e0b;
    cursor: pointer;
    box-shadow: 0 0 8px #f59e0b;
  }
  .temp-btn {
    background: #1f2937;
    border: 1px solid #374151;
    transition: all 0.2s;
    cursor: pointer;
    font-size: 11px;
  }
  .temp-btn:hover, .temp-btn.active {
    border-color: #f59e0b;
    background: #292018;
    box-shadow: 0 0 8px #f59e0b44;
  }
  .color-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
    flex-shrink: 0;
  }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

<div class="flex flex-col h-screen">
  <div class="px-6 py-3 border-b border-gray-800">
    <h1 class="text-xl font-bold glow">Black-Body Radiation Planck Curve Visualizer</h1>
    <p class="text-gray-400 text-xs mt-0.5">B(λ,T) = (2hc²/λ⁵) · 1/(e^(hc/λkT) − 1) — Wien displacement: λ_max = 2898 μm·K / T</p>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <!-- Canvas area -->
    <div class="flex-1 flex flex-col p-3 gap-2">
      <canvas id="planckCanvas" class="flex-1 w-full rounded-lg border border-gray-800"></canvas>
    </div>

    <!-- Controls -->
    <div class="w-72 bg-gray-900 border-l border-gray-800 p-4 flex flex-col gap-3 overflow-y-auto">

      <!-- Temperature slider -->
      <div>
        <label class="text-sm font-semibold text-gray-300 mb-1 block">
          Temperature: <span id="tempVal" class="text-amber-400">5778 K</span>
        </label>
        <input type="range" id="temperature" min="1000" max="40000" value="5778" step="50">
        <div class="flex justify-between text-xs text-gray-500 mt-1">
          <span>1000 K</span><span>40000 K</span>
        </div>
      </div>

      <!-- Wien marker -->
      <div class="bg-gray-800 rounded p-2 text-xs">
        <div class="text-amber-400 font-semibold mb-1">Wien Displacement Law</div>
        <div class="flex justify-between"><span class="text-gray-400">λ_max:</span><span id="wienLambda" class="text-yellow-300">—</span></div>
        <div class="flex justify-between mt-1"><span class="text-gray-400">Peak region:</span><span id="wienRegion" class="text-orange-300">—</span></div>
        <div class="flex justify-between mt-1"><span class="text-gray-400">Color temp:</span><span id="colorTemp" class="text-white">—</span></div>
      </div>

      <!-- Preset temperatures -->
      <div>
        <div class="text-sm font-semibold text-gray-300 mb-2">Color Temperature Presets</div>
        <div class="flex flex-col gap-1">
          <button class="temp-btn px-2 py-1.5 rounded flex items-center" data-temp="1800">
            <span class="color-dot" style="background:#ff5500"></span>1800 K — Candle flame
          </button>
          <button class="temp-btn px-2 py-1.5 rounded flex items-center" data-temp="2700">
            <span class="color-dot" style="background:#ff8800"></span>2700 K — Tungsten bulb
          </button>
          <button class="temp-btn px-2 py-1.5 rounded flex items-center" data-temp="3200">
            <span class="color-dot" style="background:#ffaa33"></span>3200 K — Studio halogen
          </button>
          <button class="temp-btn px-2 py-1.5 rounded flex items-center" data-temp="5000">
            <span class="color-dot" style="background:#fff5cc"></span>5000 K — Horizon daylight
          </button>
          <button class="temp-btn px-2 py-1.5 rounded flex items-center" data-temp="5778">
            <span class="color-dot" style="background:#fffde7"></span>5778 K — Sun (photosphere)
          </button>
          <button class="temp-btn px-2 py-1.5 rounded flex items-center" data-temp="6500">
            <span class="color-dot" style="background:#f0f4ff"></span>6500 K — D65 Daylight
          </button>
          <button class="temp-btn px-2 py-1.5 rounded flex items-center" data-temp="10000">
            <span class="color-dot" style="background:#cce0ff"></span>10000 K — Blue-white star (A)
          </button>
          <button class="temp-btn px-2 py-1.5 rounded flex items-center" data-temp="20000">
            <span class="color-dot" style="background:#aac8ff"></span>20000 K — Hot B-type star
          </button>
          <button class="temp-btn px-2 py-1.5 rounded flex items-center" data-temp="30000">
            <span class="color-dot" style="background:#88aaff"></span>30000 K — O-type blue star
          </button>
        </div>
      </div>

      <!-- Overlay toggle -->
      <div>
        <div class="text-sm font-semibold text-gray-300 mb-2">Overlay Curves</div>
        <div id="overlayList" class="flex flex-col gap-1 text-xs text-gray-400">
          <div class="text-gray-500 italic">Click presets to add overlay curves (max 4)</div>
        </div>
        <button id="clearOverlay" class="mt-2 text-xs text-red-400 hover:text-red-300">Clear overlays</button>
      </div>

      <!-- Axis mode -->
      <div>
        <label class="text-sm font-semibold text-gray-300 mb-1 block">Y-Axis Scale</label>
        <div class="flex gap-2">
          <button id="btnLinear" class="flex-1 temp-btn active px-2 py-1 rounded text-xs">Linear</button>
          <button id="btnLog" class="flex-1 temp-btn px-2 py-1 rounded text-xs">Log</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Physical constants
const h = 6.626e-34;   // Planck constant (J·s)
const c = 2.998e8;     // Speed of light (m/s)
const k = 1.381e-23;   // Boltzmann constant (J/K)
const WIEN = 2.898e-3; // Wien displacement constant (m·K)

function planck(lambdaM, T) {
  const exponent = (h * c) / (lambdaM * k * T);
  if (exponent > 700) return 0;
  return (2 * h * c * c) / (Math.pow(lambdaM, 5) * (Math.exp(exponent) - 1));
}

// Approximate blackbody color
function bbColor(T) {
  if (T < 2000) return '#ff4400';
  if (T < 3000) return '#ff8800';
  if (T < 4000) return '#ffbb44';
  if (T < 5000) return '#ffee99';
  if (T < 6500) return '#fffde0';
  if (T < 10000) return '#ddeeff';
  if (T < 20000) return '#aaccff';
  return '#8899ff';
}

function wienRegion(lambdaNm) {
  if (lambdaNm < 10) return 'X-ray / EUV';
  if (lambdaNm < 100) return 'Extreme UV';
  if (lambdaNm < 380) return 'Near UV';
  if (lambdaNm <= 780) return 'Visible light';
  if (lambdaNm < 2500) return 'Near Infrared';
  if (lambdaNm < 10000) return 'Mid Infrared';
  return 'Far Infrared';
}

function wavelengthToRGB(wl) {
  let r = 0, g = 0, b = 0;
  if (wl >= 380 && wl < 440) { r = -(wl - 440) / 60; b = 1; }
  else if (wl >= 440 && wl < 490) { g = (wl - 440) / 50; b = 1; }
  else if (wl >= 490 && wl < 510) { g = 1; b = -(wl - 510) / 20; }
  else if (wl >= 510 && wl < 580) { r = (wl - 510) / 70; g = 1; }
  else if (wl >= 580 && wl < 645) { r = 1; g = -(wl - 645) / 65; }
  else if (wl >= 645 && wl <= 780) { r = 1; }
  const factor = wl < 420 ? 0.3 + 0.7 * (wl - 380) / 40 : wl > 700 ? 0.3 + 0.7 * (780 - wl) / 80 : 1;
  return [Math.round(255*Math.pow(r*factor,0.8)), Math.round(255*Math.pow(g*factor,0.8)), Math.round(255*Math.pow(b*factor,0.8))];
}

const canvas = document.getElementById('planckCanvas');
const ctx = canvas.getContext('2d');

let state = {
  T: 5778,
  logScale: false,
  overlays: [] // [{T, color}]
};

const OVERLAY_COLORS = ['#22d3ee','#34d399','#f472b6','#fb923c'];

function computeCurve(T, lambdas) {
  return lambdas.map(lm => planck(lm * 1e-9, T));
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#030712';
  ctx.fillRect(0, 0, W, H);

  const pad = { left: 65, right: 30, top: 20, bottom: 45 };
  const gW = W - pad.left - pad.right;
  const gH = H - pad.top - pad.bottom;

  // Lambda range: 50nm to 3000nm
  const lMin = 50, lMax = 3000;
  const N = gW;
  const lambdas = Array.from({ length: N }, (_, i) => lMin + (i / (N - 1)) * (lMax - lMin));

  // All curves
  const allCurves = [{ T: state.T, color: bbColor(state.T), main: true }];
  state.overlays.forEach((ov, i) => allCurves.push({ ...ov, color: OVERLAY_COLORS[i % 4], main: false }));

  // Compute max for scaling
  let maxB = 0;
  for (const curve of allCurves) {
    const vals = computeCurve(curve.T, lambdas);
    const m = Math.max(...vals);
    if (m > maxB) maxB = m;
  }
  if (maxB === 0) return;

  // Grid
  ctx.strokeStyle = '#1f2937';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = pad.top + (i / 5) * gH;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + gW, y); ctx.stroke();
  }
  for (let i = 0; i <= 6; i++) {
    const x = pad.left + (i / 6) * gW;
    ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + gH); ctx.stroke();
    const lam = lMin + (i / 6) * (lMax - lMin);
    ctx.fillStyle = '#6b7280';
    ctx.font = '10px monospace';
    ctx.fillText(Math.round(lam) + 'nm', x - 15, pad.top + gH + 15);
  }

  // Visible light band (380-780nm)
  const visX1 = pad.left + ((380 - lMin) / (lMax - lMin)) * gW;
  const visX2 = pad.left + ((780 - lMin) / (lMax - lMin)) * gW;
  // Rainbow gradient fill
  const imageData = ctx.getImageData(pad.left + Math.round((380 - lMin) / (lMax - lMin) * gW),
    pad.top, Math.round((780 - 380) / (lMax - lMin) * gW), gH);
  for (let px = 0; px < imageData.width; px++) {
    const wl = 380 + (px / imageData.width) * 400;
    const [r, g, b] = wavelengthToRGB(wl);
    for (let py = 0; py < gH; py++) {
      const idx = (py * imageData.width + px) * 4;
      imageData.data[idx] = r;
      imageData.data[idx + 1] = g;
      imageData.data[idx + 2] = b;
      imageData.data[idx + 3] = 28;
    }
  }
  ctx.putImageData(imageData, pad.left + Math.round((380 - lMin) / (lMax - lMin) * gW), pad.top);

  ctx.strokeStyle = '#374151';
  ctx.setLineDash([3, 3]);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(visX1, pad.top); ctx.lineTo(visX1, pad.top + gH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(visX2, pad.top); ctx.lineTo(visX2, pad.top + gH); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#4b5563'; ctx.font = '9px monospace';
  ctx.fillText('visible', (visX1 + visX2) / 2 - 15, pad.top + 12);

  // Draw curves
  for (const curve of allCurves) {
    const vals = computeCurve(curve.T, lambdas);
    ctx.beginPath();
    let first = true;
    for (let i = 0; i < N; i++) {
      const norm = state.logScale
        ? (vals[i] > 0 ? Math.log10(vals[i] / maxB + 1e-10) / Math.log10(2) : 0)
        : vals[i] / maxB;
      const x = pad.left + i;
      const y = pad.top + gH - Math.max(0, Math.min(1, norm)) * gH;
      if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = curve.color;
    ctx.lineWidth = curve.main ? 2.5 : 1.5;
    if (!curve.main) ctx.setLineDash([5, 3]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Wien marker for main curve
    if (curve.main) {
      const wienNm = (WIEN / curve.T) * 1e9;
      if (wienNm >= lMin && wienNm <= lMax) {
        const wx = pad.left + ((wienNm - lMin) / (lMax - lMin)) * gW;
        const wi = Math.round((wienNm - lMin) / (lMax - lMin) * (N - 1));
        const norm = state.logScale
          ? (vals[wi] > 0 ? Math.log10(vals[wi] / maxB + 1e-10) / Math.log10(2) : 0)
          : vals[wi] / maxB;
        const wy = pad.top + gH - Math.max(0, Math.min(1, norm)) * gH;

        // Dashed vertical
        ctx.strokeStyle = '#fbbf24';
        ctx.setLineDash([4, 2]);
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(wx, pad.top); ctx.lineTo(wx, pad.top + gH); ctx.stroke();
        ctx.setLineDash([]);

        // Marker dot
        ctx.beginPath(); ctx.arc(wx, wy, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#fbbf24'; ctx.fill();
        ctx.strokeStyle = '#030712'; ctx.lineWidth = 1.5; ctx.stroke();

        // Label
        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 10px monospace';
        const labelX = wx + 6 < pad.left + gW - 50 ? wx + 6 : wx - 60;
        ctx.fillText(`λmax=${Math.round(wienNm)}nm`, labelX, wy - 8);
      }
    }
  }

  // Y-axis labels
  ctx.fillStyle = '#6b7280'; ctx.font = '10px monospace';
  for (let i = 0; i <= 5; i++) {
    const y = pad.top + (i / 5) * gH;
    const val = state.logScale ? '' : ((1 - i / 5) * 100).toFixed(0) + '%';
    ctx.fillText(val, 2, y + 4);
  }

  // Axes border
  ctx.strokeStyle = '#374151'; ctx.lineWidth = 1;
  ctx.strokeRect(pad.left, pad.top, gW, gH);

  // Y-axis label
  ctx.save();
  ctx.translate(12, pad.top + gH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = '#9ca3af'; ctx.font = '10px monospace';
  ctx.fillText('Spectral Radiance B(λ,T)', -60, 0);
  ctx.restore();

  // X-axis label
  ctx.fillStyle = '#9ca3af'; ctx.font = '10px monospace';
  ctx.fillText('Wavelength λ (nm)', pad.left + gW / 2 - 50, H - 5);
}

function updateInfo() {
  const T = state.T;
  const wienNm = (WIEN / T) * 1e9;
  document.getElementById('tempVal').textContent = T.toLocaleString() + ' K';
  document.getElementById('wienLambda').textContent = wienNm < 1000 ? wienNm.toFixed(1) + ' nm' : (wienNm / 1000).toFixed(2) + ' μm';
  document.getElementById('wienRegion').textContent = wienRegion(wienNm);
  document.getElementById('colorTemp').textContent =
    T < 2000 ? 'Deep red (near-IR)' :
    T < 3500 ? 'Red-orange glow' :
    T < 5000 ? 'Orange-yellow' :
    T < 6500 ? 'Yellow-white (solar)' :
    T < 10000 ? 'White-blue' : 'Blue (UV-dominant)';
}

document.getElementById('temperature').addEventListener('input', e => {
  state.T = +e.target.value;
  updateInfo();
  draw();
});

document.querySelectorAll('.temp-btn[data-temp]').forEach(btn => {
  btn.addEventListener('click', () => {
    const T = +btn.dataset.temp;
    // Add to overlay if main T already set, else set main
    if (state.overlays.find(o => o.T === T)) return;
    // If clicking same as main, add to overlay instead
    if (state.overlays.length < 4 && T !== state.T) {
      state.overlays.push({ T });
      updateOverlayList();
    }
    // Also set as current
    state.T = T;
    document.getElementById('temperature').value = T;
    updateInfo();
    draw();
  });
});

document.getElementById('clearOverlay').addEventListener('click', () => {
  state.overlays = [];
  updateOverlayList();
  draw();
});

function updateOverlayList() {
  const list = document.getElementById('overlayList');
  if (state.overlays.length === 0) {
    list.innerHTML = '<div class="text-gray-500 italic">Click presets to add overlay curves (max 4)</div>';
    return;
  }
  list.innerHTML = state.overlays.map((ov, i) =>
    `<div class="flex items-center gap-2"><span class="color-dot" style="background:${OVERLAY_COLORS[i]}"></span><span>${ov.T.toLocaleString()} K</span></div>`
  ).join('');
}

document.getElementById('btnLinear').addEventListener('click', () => {
  state.logScale = false;
  document.getElementById('btnLinear').classList.add('active');
  document.getElementById('btnLog').classList.remove('active');
  draw();
});
document.getElementById('btnLog').addEventListener('click', () => {
  state.logScale = true;
  document.getElementById('btnLog').classList.add('active');
  document.getElementById('btnLinear').classList.remove('active');
  draw();
});

function resize() {
  canvas.width = canvas.parentElement.clientWidth - 12;
  canvas.height = canvas.parentElement.clientHeight - 20;
  draw();
}
window.addEventListener('resize', resize);
updateInfo();
resize();
</script>
</body>
</html>
